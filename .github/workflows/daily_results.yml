name: Daily Match Results

on:
  schedule:
    # Pre-match run: 09:00 UTC daily (picks up today's scheduled fixtures, posts previews)
    - cron: "0 9 * * *"
    # Post-match run: 23:00 UTC daily (picks up completed results, posts result recaps)
    - cron: "0 23 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/admiring-cannon-tzi587

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run match results checker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPTICODDS_KEY: ${{ secrets.OPTICODDS_KEY }}
        run: python check_results.py
